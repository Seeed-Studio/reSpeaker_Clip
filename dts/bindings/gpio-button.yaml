# SPDX-License-Identifier: Apache-2.0

description: |
  Software debounced button with single, double, long press detection.

compatible: "gpio-button"

include: base.yaml

properties:
  gpios:
    type: phandle-array
    required: true
    description: GPIO pin the button is connected to

  label:
    type: string
    description: Human-readable label for the button

  debounce-ms:
    type: int
    required: false
    default: 30
    description: Debounce time in milliseconds

  long-press-ms:
    type: array
    required: false
    description: Multi-level long-press thresholds in milliseconds

  double-click-ms:
    type: int
    required: false
    default: 400
    description: Max time between two clicks for double click in ms
