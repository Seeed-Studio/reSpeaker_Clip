#
# WiFi AP Mode Configuration for ReSpeaker Clip
# Based on Nordic nRF70 softap sample
#

# =============================================================================
# WiFi Core Configuration
# =============================================================================
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y

# WPA supplicant
CONFIG_WIFI_NM_WPA_SUPPLICANT=y

# Soft AP mode
CONFIG_NRF70_AP_MODE=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_AP=y

CONFIG_WIFI_NM_WPA_SUPPLICANT_LOG_LEVEL_INF=y

# =============================================================================
# Networking Stack
# =============================================================================
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
# CONFIG_NET_LOG=n  # Disable network logging to reduce FLASH
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n  # Disable IPv6 to save memory
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y

# Network buffers - tuned for AP mode
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NRF70_RX_NUM_BUFS=16

# Memory configuration for WiFi AP
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=20000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=53000

CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_MAX_CONTEXTS=5
CONFIG_NET_CONTEXT_SYNC_RECV=y

# CONFIG_INIT_STACKS=n  # Disable to save FLASH
CONFIG_NET_L2_ETHERNET=y

CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
CONFIG_NET_SOCKETS_POLL_MAX=10

# =============================================================================
# Static IP Configuration for AP
# =============================================================================
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.4.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.4.1"

# =============================================================================
# Memory Configuration
# =============================================================================
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096

# Thread stack for WiFi operations - increased to prevent stack overflow
CONFIG_WIFI_NM_WPA_SUPPLICANT_THREAD_STACK_SIZE=10240

# mbedtls heap
CONFIG_MBEDTLS_HEAP_SIZE=1024

# System heap
CONFIG_HEAP_MEM_POOL_SIZE=70000

# =============================================================================
# System Configuration
# =============================================================================
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n

# =============================================================================
# Logging
# =============================================================================
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BUFFER_SIZE=1024
CONFIG_LOG_BACKEND_UART=y

# =============================================================================
# Hardware Drivers
# =============================================================================
# Display support (OLED CH1115)
CONFIG_DISPLAY=y
CONFIG_GPIO=y

# I2C for display
CONFIG_I2C=y

# Hardware info for chip ID (used for unique SSID)
CONFIG_HWINFO=y
CONFIG_HWINFO_SHELL=n

# =============================================================================
# Shell Configuration
# =============================================================================
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_NET_SHELL=y
CONFIG_SHELL_CMDS_RESIZE=n

# =============================================================================
# Kernel Options
# =============================================================================
CONFIG_ENTROPY_GENERATOR=y
CONFIG_POSIX_TIMERS=y

# =============================================================================
# Debugging
# =============================================================================
# CONFIG_STACK_SENTINEL=n  # Disable to save FLASH
# CONFIG_INIT_STACKS=n  # Disable to save FLASH

# =============================================================================
# DHCP Configuration
# =============================================================================
# Note: DHCP client is disabled by default when NET_CONFIG_SETTINGS is set
# with static IP. AP mode uses DHCP server which is enabled by default.

# =============================================================================
# Network Management
# =============================================================================
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
# Increase timeout for crowded environments
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000

# =============================================================================
# WiFi Configuration
# =============================================================================
# Fixed MAC address for WiFi
CONFIG_WIFI_FIXED_MAC_ADDRESS="14:5A:FC:5E:37:9C"

# =============================================================================
# File System (temporarily enabled for linking)
# =============================================================================
CONFIG_FILE_SYSTEM=y
