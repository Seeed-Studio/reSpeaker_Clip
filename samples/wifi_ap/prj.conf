# WiFi AP Mode Configuration for ReSpeaker Clip

# WiFi core
CONFIG_WIFI=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=y

# nRF70 WiFi driver configuration
CONFIG_NRF70_RX_NUM_BUFS=8
CONFIG_NRF70_MAX_TX_AGGREGATION=2
CONFIG_NRF70_RPU_PS_IDLE_TIMEOUT_MS=3600000

# Disable WiFi credentials storage
CONFIG_WIFI_CREDENTIALS=n

# Networking stack
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POLL_MAX=4
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y

# Network buffers - optimized for AP mode
CONFIG_NET_BUF_TX_COUNT=14
CONFIG_NET_BUF_RX_COUNT=14
CONFIG_NET_PKT_TX_COUNT=6
CONFIG_NET_PKT_RX_COUNT=6
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_BUF_FIXED_DATA_SIZE=y
CONFIG_NET_BUF_DATA_SIZE=512

# Network management API
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_CONNECTION_MANAGER=y

# DHCP server for AP mode
CONFIG_NET_DHCPV4_SERVER=y

# mbedTLS for security
CONFIG_MBEDTLS=y

# Heap size for WiFi/crypto operations
CONFIG_HEAP_MEM_POOL_SIZE=49152

# Memory optimization
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144
CONFIG_MAIN_STACK_SIZE=6144

# System settings
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y

# Display support (OLED CH1115)
CONFIG_DISPLAY=y
CONFIG_GPIO=y

# I2C for display
CONFIG_I2C=y

# Shell for WiFi control
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_NET_SHELL=y
