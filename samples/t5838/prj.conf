# PDM/DMIC Configuration for nRF5340
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# I2C for potential sensor communication
CONFIG_I2C=y

# Sensor framework (for potential future use)
CONFIG_SENSOR=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=n

# PWM for LEDs (status indication)
CONFIG_PWM=y
CONFIG_PWM_NRFX=y

# GPIO for buttons
CONFIG_GPIO=y
