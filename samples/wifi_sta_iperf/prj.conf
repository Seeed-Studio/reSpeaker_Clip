# WiFi STA + iperf — minimal delta from the proven samples/wifi_ap_iperf.
# Only the AP→STA differences are changed; everything else is kept
# identical to the working AP sample (AUTO_START bring-up at boot,
# memory/heap/buffer sizing, driver set, libc).

# =============================================================================
# WiFi Core Configuration
# =============================================================================
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_LOG_LEVEL_INF=n
CONFIG_WIFI_RANDOM_MAC_ADDRESS=y
CONFIG_NRF_WIFI_IF_AUTO_START=y

# Boot-time RPU bring-up visibility (matches earlier debugging sessions)
CONFIG_WIFI_NRF70_LOG_LEVEL_DBG=y

# =============================================================================
# zperf Configuration (Network Throughput Testing)
# =============================================================================
CONFIG_NET_ZPERF=y

# =============================================================================
# Networking Stack
# =============================================================================
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOG=n
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n

# Network buffers - same tuning as the AP sample
CONFIG_NET_PKT_RX_COUNT=3
CONFIG_NET_PKT_TX_COUNT=3
CONFIG_NET_BUF_RX_COUNT=6
CONFIG_NET_BUF_TX_COUNT=6
CONFIG_NRF70_RX_NUM_BUFS=8
CONFIG_NRF70_MAX_TX_AGGREGATION=2

CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=20000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=53000
CONFIG_NRF70_RPU_PS_IDLE_TIMEOUT_MS=3600000

CONFIG_WIFI_CREDENTIALS=n

CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_MAX_CONTEXTS=4
CONFIG_NET_CONTEXT_SYNC_RECV=y

CONFIG_NET_L2_ETHERNET=y

# No net_config static setup — the STA address comes from the router:
# DHCP client started after the link connects.
CONFIG_NET_CONFIG_SETTINGS=n

# DHCP client (was: DHCP *server* for AP clients in the AP sample)
CONFIG_NET_DHCPV4=y

# Per-interface TX counters — the iperf progress reporter reads
# iface->stats.bytes.sent every 5 s (also doubles as a "is it really
# sending" diagnostic when the PC side sees nothing).
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_PER_INTERFACE=y

# =============================================================================
# Memory Configuration
# =============================================================================
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_WIFI_NM_WPA_SUPPLICANT_THREAD_STACK_SIZE=10240
CONFIG_MBEDTLS_HEAP_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=80000

# =============================================================================
# System Configuration
# =============================================================================
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y

# =============================================================================
# Logging
# =============================================================================
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=512
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MAX_LEVEL=3

# =============================================================================
# Hardware Drivers
# =============================================================================
CONFIG_GPIO=y
# Disable unused clip board drivers
CONFIG_OLED_DISPLAY=n
CONFIG_DISPLAY=n
CONFIG_MFD_NPM13XX=n
CONFIG_GPIO_NPM13XX=n
CONFIG_REGULATOR_NPM13XX=n

CONFIG_HWINFO=y
CONFIG_HWINFO_SHELL=n

# The clip_usb_dfu module defaults on; its default-CDC references &usbd,
# which this sample's overlay disables (USB off) — a latent repo-wide
# breakage for every usbd-disabled build of this module.
CONFIG_CLIP_USB_DFU=n

# =============================================================================
# Shell Configuration
# =============================================================================
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=5200
CONFIG_SHELL_CMDS_RESIZE=n
CONFIG_SHELL_GETOPT=y

# =============================================================================
# Kernel Options
# =============================================================================
CONFIG_ENTROPY_GENERATOR=y
CONFIG_POSIX_TIMERS=y

# =============================================================================
# Network Management
# =============================================================================
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
