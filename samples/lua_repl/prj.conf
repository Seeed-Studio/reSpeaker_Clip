# Lua 5.5.0 REPL configuration

# Enable logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Enable Lua library
CONFIG_LUA=y

# Console (UART) settings - polling mode
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# Memory settings - increase heap for Lua
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_MAIN_STACK_SIZE=8192

# Thread settings
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=-1
