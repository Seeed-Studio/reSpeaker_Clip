# SPDX-License-Identifier: Apache-2.0

# PDM/DMIC Configuration
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# SD Card and File System
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_MAX_LFN=64

# I2C for potential sensor communication
CONFIG_I2C=y

# Sensor framework
CONFIG_SENSOR=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=n

# PWM for LEDs (status indication)
CONFIG_PWM=y
CONFIG_PWM_NRFX=y

# GPIO for buttons
CONFIG_GPIO=y

# Regulator for SD card power control
CONFIG_REGULATOR=y

# Opus codec library
CONFIG_OPUS_CODEC=y

# SpeexDSP audio processing library (noise suppression, dereverb)
CONFIG_SPEEXDSP=y

# Increase stack size for Opus encoding
CONFIG_MAIN_STACK_SIZE=32768

# Heap size for Opus and SD card operations
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Bluetooth for Opus audio streaming
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ReSpeaker Opus"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_CLIENT=y

# BLE throughput optimization - larger buffers for better performance
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_L2CAP_TX_MTU=247

# BLE RX stack size
CONFIG_BT_RX_STACK_SIZE=2048
