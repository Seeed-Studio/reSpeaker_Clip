# Bluetooth BLE configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="reSpeaker Clip"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_CLIENT=y

# BLE throughput optimization
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_L2CAP_TX_MTU=247

# BLE RX stack size
CONFIG_BT_RX_STACK_SIZE=2048

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=n

# Main stack size (increased for AT command processing)
CONFIG_MAIN_STACK_SIZE=16384

# Heap for JSON and buffers
CONFIG_HEAP_MEM_POOL_SIZE=65536

# GPIO for button
CONFIG_GPIO=y

# Custom GPIO button driver
CONFIG_GPIO_BUTTON=y
CONFIG_INPUT_GPIO_BUTTON_OWN_THREAD=y
CONFIG_INPUT_GPIO_BUTTON_THREAD_STACK_SIZE=512
CONFIG_INPUT_GPIO_BUTTON_THREAD_PRIORITY=5

# I2C for PMIC and display
CONFIG_I2C=y

# Display (CH1115 OLED via I2C) - Disabled for now
# CONFIG_SSD1306=y

# Audio configuration
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# Opus codec library
CONFIG_OPUS_CODEC=y

# SpeexDSP audio processing library
CONFIG_SPEEXDSP=y

# SD Card and File System
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
# Use HEAP mode for LFN to enable thread-safe FATFS
CONFIG_FS_FATFS_LFN_MODE_HEAP=y
# Enable FATFS reentrant/thread-safe operations for concurrent read/write
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_FS_FATFS_MKFS=y
CONFIG_FILE_SYSTEM_MKFS=y

# Flash and NVS for configuration storage
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
# CONFIG_SETTINGS=y  # Disabled for now - requires partition manager config
CONFIG_SETTINGS_RUNTIME=n
CONFIG_NVS=y
# Enable settings to use NVS backend
# CONFIG_SETTINGS_NVS=y  # Disabled for now
