# Bluetooth BLE configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
# Device name is now dynamically generated: "Clip XXXX" (chip ID suffix)
# CONFIG_BT_DEVICE_NAME is kept for reference but not used by code
CONFIG_BT_DEVICE_NAME="Clip"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_CLIENT=y

# BLE throughput optimization
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_L2CAP_TX_MTU=247

# BLE RX stack size
CONFIG_BT_RX_STACK_SIZE=2048

# BLE Pairing & Bonding (Security Manager Protocol)
# Enables LE Secure Connections: unbonded devices are rejected,
# only the one bonded phone can connect. Reset via AT+PAIR=reset.
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_SETTINGS=y
CONFIG_BT_FILTER_ACCEPT_LIST=y
# Notify bonded phones that GATT service database changed (fixes service caching issue)
# Without this, phones that cached the pre-pairing service list won't re-discover
CONFIG_BT_GATT_SERVICE_CHANGED=y
CONFIG_BT_GATT_CACHING=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=n
# Increase log buffer to avoid dropped messages
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PRINTK=y

# Main stack size (increased for AT command processing)
CONFIG_MAIN_STACK_SIZE=16384

# Heap for JSON and buffers
CONFIG_HEAP_MEM_POOL_SIZE=65536

# GPIO for button
CONFIG_GPIO=y

# Custom GPIO button driver
CONFIG_GPIO_BUTTON=y
CONFIG_INPUT_GPIO_BUTTON_OWN_THREAD=y
CONFIG_INPUT_GPIO_BUTTON_THREAD_STACK_SIZE=512
CONFIG_INPUT_GPIO_BUTTON_THREAD_PRIORITY=5

# I2C for PMIC and display
CONFIG_I2C=y

# MFD and npm1300 charger/fuel-gauge sensor
CONFIG_MFD=y
CONFIG_SENSOR=y
CONFIG_NPM13XX_CHARGER=y

# GPIO for display power control
CONFIG_REGULATOR=y  

# Display (CH1115 OLED via I2C)
CONFIG_DISPLAY=y
CONFIG_OLED_DISPLAY=y

# Audio configuration
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# Opus codec library
CONFIG_OPUS_CODEC=y

# SpeexDSP audio processing library
CONFIG_SPEEXDSP=y

# SD Card and File System
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
# Use HEAP mode for LFN to enable thread-safe FATFS
CONFIG_FS_FATFS_LFN_MODE_HEAP=y
# Enable FATFS reentrant/thread-safe operations for concurrent read/write
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_FS_FATFS_MKFS=y
CONFIG_FILE_SYSTEM_MKFS=y

# Flash and NVS for configuration storage
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=n
CONFIG_NVS=y
# Enable settings to use NVS backend
CONFIG_SETTINGS_NVS=y
# Enable reboot for AT+REBOOT command
CONFIG_REBOOT=y

# ==============================================================================
# Bluetooth OTA DFU (MCUmgr) - Dual-Core Support with External SPI Flash
# ==============================================================================
# Enable MCUmgr OTA DFU over Bluetooth LE
# This enables the SMP (Simple Management Protocol) service that runs
# continuously in the background, allowing firmware updates at any time.
# Supports dual-core (application + network core) simultaneous updates.
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y

# Increase system work queue stack for OTA operations
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
