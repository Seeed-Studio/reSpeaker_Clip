# SPDX-License-Identifier: Apache-2.0
#
# Clip Application Configuration
# Refactored version with modular architecture
#

# ==============================================================================
# FPU + CMSIS-DSP
# ==============================================================================
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_CMSIS_DSP=y

# ==============================================================================
# Logging Configuration
# ==============================================================================
CONFIG_LOG=y
CONFIG_ASSERT=n
CONFIG_CLIP_LOG_LEVEL_INF=y
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD=y

# FS log backend (SD card /SD:/LOG/)
CONFIG_LOG_BACKEND_FS=y
CONFIG_LOG_BACKEND_FS_DIR="/SD:/LOG"
CONFIG_LOG_BACKEND_FS_FILE_PREFIX="log."
CONFIG_LOG_BACKEND_FS_FILE_SIZE=65536
CONFIG_LOG_BACKEND_FS_FILES_LIMIT=10
CONFIG_LOG_BACKEND_FS_OVERWRITE=y
CONFIG_LOG_BACKEND_FS_APPEND_TO_NEWEST_FILE=y

# Minimize log output overhead
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_LOG_PRINTK=n

# Disable validation features to save flash
CONFIG_SPIN_VALIDATE=n
CONFIG_MEM_SLAB_POINTER_VALIDATE=n

# ==============================================================================
# Main Stack and Heap
# ==============================================================================
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_HEAP_MEM_POOL_SIZE=81920
CONFIG_CLIP_AT_SERVER_STACK_SIZE=8192
CONFIG_CLIP_TRANSFER_STACK_SIZE=4096
CONFIG_CLIP_UDP_THREAD_STACK_SIZE=2048

# ==============================================================================
# Reboot Support
# ==============================================================================
CONFIG_REBOOT=y

# ==============================================================================
# Power Management (System ON Idle)
# ==============================================================================
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_TICKLESS_KERNEL=y

# ==============================================================================
# Thread Monitoring (disabled to save ~20KB flash)
# ==============================================================================
CONFIG_THREAD_MONITOR=n
CONFIG_THREAD_NAME=n
CONFIG_THREAD_RUNTIME_STATS=n
CONFIG_THREAD_RUNTIME_STATS_USE_TIMING_FUNCTIONS=n
CONFIG_INIT_STACKS=n
CONFIG_STACK_SENTINEL=n
CONFIG_SYS_HEAP_RUNTIME_STATS=n

# DWT cycle counter for precise timing measurement
CONFIG_CORTEX_M_DWT=y

# Debug stats (thread stack + heap usage)
CONFIG_CLIP_DEBUG_STATS=n

# ==============================================================================
# Retention subsystem for MCUboot USB DFU mode trigger
# ==============================================================================
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y

# ==============================================================================
# Bluetooth BLE Configuration (minimal for OTA)
# ==============================================================================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Clip"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_MAX_CONN=1

# BLE throughput optimization
CONFIG_BT_BUF_ACL_RX_SIZE=517
CONFIG_BT_BUF_ACL_TX_SIZE=517
CONFIG_BT_L2CAP_TX_MTU=517
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_RX_STACK_SIZE=4096

# BLE Pairing & Bonding
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_SETTINGS=y
CONFIG_BT_FILTER_ACCEPT_LIST=y
CONFIG_BT_GATT_SERVICE_CHANGED=y
CONFIG_BT_GATT_CACHING=y
CONFIG_BT_ASSERT_VERBOSE=n

# ==============================================================================
# GPIO and Regulators
# ==============================================================================
CONFIG_GPIO=y
CONFIG_REGULATOR=y

# Custom GPIO button driver
CONFIG_GPIO_BUTTON=y
CONFIG_INPUT_GPIO_BUTTON_OWN_THREAD=y
CONFIG_INPUT_GPIO_BUTTON_THREAD_STACK_SIZE=512
CONFIG_INPUT_GPIO_BUTTON_THREAD_PRIORITY=5

# Haptic motor control
CONFIG_CLIP_HAPTIC_MOTOR_ENABLED=y

# Display
CONFIG_DISPLAY=y

# I2C for PMIC and Display
CONFIG_I2C=y

# MFD and npm1300 charger/fuel-gauge sensor (required for SD card power)
CONFIG_MFD=y
CONFIG_SENSOR=y
CONFIG_NPM13XX_CHARGER=y

# Nordic nRF Fuel Gauge Library for accurate battery SoC estimation
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_NRF_FUEL_GAUGE_VARIANT_SECONDARY_CELL=y

# BLE Battery Service
CONFIG_BT_BAS=y
CONFIG_BT_BAS_BLS=y
CONFIG_BT_BAS_BLS_BATTERY_LEVEL_PRESENT=y
CONFIG_BT_BAS_BLS_ADDITIONAL_STATUS_PRESENT=y

# ==============================================================================
# Settings and Storage
# ==============================================================================
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y

# File Systems
CONFIG_FILE_SYSTEM=y

# LittleFS for settings
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_FMP_DEV=y
CONFIG_FS_LITTLEFS_FC_HEAP_SIZE=4096
CONFIG_FS_LITTLEFS_NUM_FILES=16
CONFIG_FS_LITTLEFS_NUM_DIRS=4

# FATFS for SD card
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_HEAP=y
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y

CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/lfs/settings/run"
CONFIG_SETTINGS_FILE_MAX_LINES=16

# ==============================================================================
# Bluetooth OTA DFU (MCUmgr) - App core + Network core
# ==============================================================================
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_MCUMGR_GRP_IMG_UPDATABLE_IMAGE_NUMBER=2
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y

# ==============================================================================
# Flash Size Optimization (-Oz)
# ==============================================================================
CONFIG_NO_OPTIMIZATIONS=n
CONFIG_DEBUG_OPTIMIZATIONS=n
CONFIG_SPEED_OPTIMIZATIONS=n
CONFIG_SIZE_OPTIMIZATIONS=n
CONFIG_SIZE_OPTIMIZATIONS_AGGRESSIVE=y

# Link Time Optimization
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_LTO=y

# ==============================================================================
# Audio Configuration (DMIC + Opus + SpeexDSP)
# ==============================================================================
CONFIG_CLIP_AUDIO_ENABLED=y

# DMIC (PDM Microphone)
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# Opus Codec
CONFIG_OPUS_CODEC=y

# SpeexDSP for audio preprocessing (noise suppression, AGC, dereverb)
# Only used in enhanced/merge mode, not in stereo mode
CONFIG_SPEEXDSP=y

# Thread stack for audio (needs more space for Opus encoding)
CONFIG_CLIP_AUDIO_STACK_SIZE=32768
CONFIG_CLIP_AUDIO_THREAD_PRIORITY=0

# =============================================================================
# Audio Segment Duration (configured via Kconfig, not hardcoded here)
# Use CLIP_AUDIO_SEGMENT_DURATION_SYNC and CLIP_AUDIO_SEGMENT_DURATION_NO_SYNC
# from Kconfig to set these values (default: 60s and 300s)
# =============================================================================
CONFIG_CLIP_AUDIO_SEGMENT_DURATION_SYNC=60
CONFIG_CLIP_AUDIO_SEGMENT_DURATION_NO_SYNC=300

CONFIG_CLIP_STORAGE_FILES_PER_GROUP=100

# ==============================================================================
# WiFi AP Configuration
# ==============================================================================
# nRF7002 firmware patches stored on external SPI flash (saves ~87KB internal)
# ==============================================================================
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
CONFIG_NRF70_AP_MODE=y

# WiFi/BLE coexistence: MPSL_CX=y on net core + NRF70_SR_COEX=y on app core.
# NRF70_SR_COEX_RF_SWITCH is NOT enabled (no RF switch hardware on this board).
CONFIG_NRF70_SR_COEX=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_AP=y
# Suppress WPA supplicant log strings (saves ~10KB flash)
CONFIG_WIFI_NM_WPA_SUPPLICANT_LOG_LEVEL_ERR=y
# Disable WPA3/SAE — device uses WPA2-PSK only (saves ~23KB flash)
CONFIG_WIFI_NM_WPA_SUPPLICANT_WPA3_IMPLEMENTATION_NONE=y

# AP-only mode — STA infrastructure required by AP code, cannot disable
# CONFIG_NRF70_STA_MODE=n

# Crypto: SHA512/DHM disable caused sta_set_flags errors, keep enabled for now
# CONFIG_MBEDTLS_SHA512_C=n
# CONFIG_MBEDTLS_SHA384_C=n
# CONFIG_MBEDTLS_DHM_C=n
CONFIG_WIFI_RANDOM_MAC_ADDRESS=y

# WiFi ready callback library (for runtime net_if_up)
CONFIG_WIFI_READY_LIB=y

# WiFi driver manual start (user must call net_if_up before AP mode)
# This saves ~30mA when WiFi is not in use.
CONFIG_NRF_WIFI_IF_AUTO_START=n

# QSPI low power mode (saves ~0.1-0.3mA when WiFi is off)
CONFIG_NRF70_QSPI_LOW_POWER=y

# Minimal networking stack (IPv4 + UDP + DHCP, no IPv6/TCP)
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=1
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
CONFIG_NET_LOG=n

# AP static IP
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.4.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.4.1"

CONFIG_MBEDTLS_HEAP_SIZE=1024


# Minimal WiFi buffer sizes (tune for RAM/flash balance)
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_PKT_BUF_TX_DATA_POOL_SIZE=16384
CONFIG_CLIP_UDP_SOCKET_BUF_SIZE=4096
CONFIG_NRF70_RX_NUM_BUFS=8
CONFIG_NRF70_MAX_TX_AGGREGATION=4
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=20000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=40000

CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_MAX_CONN=6
CONFIG_NET_CONTEXT_SYNC_RECV=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
CONFIG_NET_SOCKETS_POLL_MAX=4
CONFIG_NET_TCP_TIME_WAIT_DELAY=0
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048

CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_TX_STACK_SIZE=2048

CONFIG_NRF70_IRQ_WQ_STACK_SIZE=1024

CONFIG_WIFI_NM_WPA_SUPPLICANT_THREAD_STACK_SIZE=10240
CONFIG_WIFI_NM_WPA_SUPPLICANT_WQ_STACK_SIZE=2048

# Required by WPA supplicant
CONFIG_POSIX_TIMERS=y
CONFIG_ENTROPY_GENERATOR=y

# Hardware info for SSID generation from chip ID
CONFIG_HWINFO=y

# ==============================================================================
# USB - CDC ACM (AT command serial) + MSC (SD card, on demand)
# ==============================================================================
CONFIG_USB_DEVICE_STACK_NEXT=y

# CDC ACM (virtual serial port for AT commands)
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# MSC (Mass Storage, enabled via AT+MSC=on)
CONFIG_USBD_MSC_CLASS=y
CONFIG_USBD_MSC_LUNS_PER_INSTANCE=1
CONFIG_USBD_MSC_DOUBLE_BUFFERING=n
CONFIG_USBD_MSC_SCSI_BUFFER_SIZE=512
CONFIG_USBD_MSC_STACK_SIZE=1024
