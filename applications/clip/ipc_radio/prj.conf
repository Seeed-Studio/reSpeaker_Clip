#
# IPC Radio configuration for network core
#
# This is the network core firmware that handles Bluetooth HCI
# over IPC with the application core.

CONFIG_BT_HCI_RAW=y
CONFIG_BT_RECV_WORKQ=y

# IPC Radio for Bluetooth
CONFIG_IPC_RADIO_BT=y
CONFIG_IPC_RADIO_BT_HCI_IPC=y

# Optimize for throughput
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502

# Disable unused features to reduce size
CONFIG_BT_SMP=n
CONFIG_BT_GATT_CLIENT=n
CONFIG_BT_GATT_MTU_SIZE=23
