#
# IPC Radio configuration for network core
#
# This configures the Bluetooth HCI IPC transport between application core
# and network core on nRF5340.

# Bluetooth HCI over IPC
CONFIG_BT_HCI_RAW=y
CONFIG_IPC_RADIO_BT=y
CONFIG_IPC_RADIO_BT_HCI_IPC=y

# Data length extension for better throughput
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
