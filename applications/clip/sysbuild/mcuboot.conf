#
# MCUboot configuration for the bootloader image
#
# These settings configure MCUboot's behavior when running as the bootloader.
# This configuration supports external SPI Flash (PY25Q64H on SPI3) for DFU.

# Increase max image sectors to support larger firmware images
CONFIG_BOOT_MAX_IMG_SECTORS=256

# Enable SPI NOR flash support for external flash (SPI3, not QSPI)
# The PY25Q64H is connected via SPI3 with jedec-id = [ 85 20 17 ]
CONFIG_SPI_NOR=y

# Disable unnecessary drivers for MCUboot (reduce size and avoid link errors)
CONFIG_I2C=n
CONFIG_DISPLAY=n
CONFIG_MFD=n
# Keep INPUT enabled for button-triggered serial recovery
# CONFIG_INPUT=n  # Commented out - needed for mcuboot-button0

# Keep SPI enabled for external flash access
CONFIG_SPI=y

# =============================================================================
# USB Serial Recovery Configuration (DFU over USB)
# =============================================================================
# Step 1.1 - Configure serial recovery to use CDC_ACM (USB)
CONFIG_BOOT_SERIAL_CDC_ACM=y

# Enable Serial Recovery support
CONFIG_MCUBOOT_SERIAL=y

# Disable console UART - using USB CDC ACM instead
CONFIG_UART_CONSOLE=n

# Step 3.1 - Increase flash space for MCUboot to fit USB drivers
# Default is 0xC000, need more space for USB CDC ACM stack
# 0x11000 overflowed by 944 bytes, increased to 0x13000 (76KB)
CONFIG_PM_PARTITION_SIZE_MCUBOOT=0x13000
