[pytest]
# Pytest configuration for reSpeaker Clip tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# Output options
# Note: Coverage is optional - use --cov flag to enable
addopts =
    -v
    --strict-markers
    --tb=short
    -p no:warnings

# Markers
markers =
    stress: marks tests as stress tests (long-running, use with -m 'not stress')
    slow: marks tests as slow (require device interaction)
    unit: marks tests as unit tests (no device required)
    device: marks tests as requiring a physical device

# Test paths
testpaths = tests

# Coverage options (only used when --cov flag is provided)
[coverage:run]
source = clip
omit =
    */tests/*
    */test_*.py
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
