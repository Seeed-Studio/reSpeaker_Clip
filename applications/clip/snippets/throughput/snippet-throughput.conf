# Throughput-test firmware: strip non-essential features to make flash room
# for the AT+BLETHRU / AT+WIFITHRU test (enabled via
# -DCONFIG_CLIP_THROUGHPUT_TEST=y at build time).
#
# This snippet's EXTRA_CONF_FILE is broadcast to every sysbuild image
# (including mcuboot), so it may only set Zephyr-core symbols that exist in
# all images. App-only CLIP_* symbols (CLIP_THROUGHPUT_TEST) cannot be set
# here — pass them on the west command line with -D, which is ignored by
# images that don't define them.
#
# Build:
#   west build --build-dir build-clip-thru --pristine \
#     --board clip/nrf5340/cpuapp applications/clip -- \
#     -DSNIPPET_ROOT=$(pwd)/applications/clip -DSNIPPET=throughput \
#     -DCONFIG_CLIP_THROUGHPUT_TEST=y

# Drop the SD-card FS log backend (not needed for throughput testing; the
# rate is reported via BLE event). Frees flash + lets the SD card idle.
CONFIG_LOG_BACKEND_FS=n

# Drop SpeexDSP preprocessing (noise suppression / AGC / dereverb). Only used
# in enhanced/merge audio mode; audio.c gates all references with #ifdef.
# Frees a chunk of flash for the test feature.
CONFIG_SPEEXDSP=n
