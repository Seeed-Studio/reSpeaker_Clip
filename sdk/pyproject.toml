[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "respeaker-clip-sdk"
version = "0.1.0"
description = "Async Python SDK for the reSpeaker Clip firmware protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Seeed Technology" }]
keywords = ["respeaker", "clip", "ble", "audio", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
ble = ["bleak>=3.0"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
wifi = []
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
examples = ["opuslib>=2.0.0", "numpy>=1.26"]

[project.scripts]
clip-sdk = "clip.cli:main"
"clip.terminal" = "clip.tools.terminal:main"
"clip.sync" = "clip.tools.sync:main"
"clip.record" = "clip.tools.record:main"
"clip.web" = "clip.tools.web:main"
"clip.wifi" = "clip.tools.wifi:main"
"clip.stream" = "clip.tools.stream:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra"
