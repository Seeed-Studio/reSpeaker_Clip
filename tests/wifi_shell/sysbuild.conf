# Cert/test firmware — flashed directly via J-Link, like tests/wifi_radio.
# No MCUboot, no b0n secure-boot, no netcore (WiFi runs from the app core over
# QSPI; BLE is not needed here), no Partition Manager (image links at 0x0).
SB_CONFIG_BOOTLOADER_NONE=y
SB_CONFIG_SECURE_BOOT_NETCORE=n
SB_CONFIG_NETCORE_NONE=y
SB_CONFIG_PARTITION_MANAGER=n
