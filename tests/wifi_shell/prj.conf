# Wi-Fi Shell 认证测试固件 — NCS nrf/samples/wifi/shell 移植。
#
# 配置原则（两层）：
#   1. 射频/驱动层默认值与 applications/clip（量产固件）完全对齐 —
#      coex、buffer/heap、supplicant 栈，保证测到的 RF 行为就是产品行为。
#      （2.4G 发射功率上限 9 dBm 由板级 DTS wifi-max-tx-pwr-2g-* 下发，
#       所有构建共享，本固件同样生效。）
#   2. 测试层保留 Nordic 认证程序要求的增量：NET_L2_WIFI_SHELL +
#      zperf + CONFIG_NRF70_UTIL（`nrf70 util tx_rate` 固定发射速率，
#      EN 300 328 / EN 301 893 adaptivity 测试的 DUT 配置）。
#      见 nrf/doc/nrf/protocols/wifi/regulatory_certification/
#      adaptivity_test_procedure.rst

# =============================================================================
# WiFi Core（driver 层跟 applications/clip）
# =============================================================================
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y

# STA 模式连接实验室 AP（量产固件是 AP 模式；本固件复现实验室的
# STA + zperf 上行发射测法，其余驱动配置与量产一致）
CONFIG_NRF70_STA_MODE=y

# 不开 SR coex！量产的 NRF70_SR_COEX=y 依赖网络核 MPSL_CX 驱动 GRANT 线；
# 本固件 NETCORE_NONE（无网络核），coex 无人应答会把系统卡死（shell 输入
 # 饿死）。单机认证固件与送测的 wifi_sta_iperf 一致：coex 关。
CONFIG_NRF70_SR_COEX=n

CONFIG_WIFI_NM_WPA_SUPPLICANT=y
# WPA2-PSK only（跟量产固件，省 ~23KB flash）
CONFIG_WIFI_NM_WPA_SUPPLICANT_WPA3_IMPLEMENTATION_NONE=y
# 量产固件用 ERR 级别省 flash；认证测试保留 INF 方便实验室排查
CONFIG_WIFI_NM_WPA_SUPPLICANT_LOG_LEVEL_INF=y

CONFIG_WIFI_RANDOM_MAC_ADDRESS=y

# QSPI low power — 跟量产固件
CONFIG_NRF70_QSPI_LOW_POWER=y
# RPU 省电超时必须放大（送测 wifi_sta_iperf 同款）：驱动默认 10ms，
# 开机 AUTO_START 自动起 RPU 时会被省电切换打断 → 启动挂死。
CONFIG_NRF70_RPU_PS_IDLE_TIMEOUT_MS=3600000

# =============================================================================
# 测试层：Wi-Fi shell + zperf + nrf70 util
# =============================================================================
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_ZPERF=y

# The certification knob: `nrf70 util tx_rate <flag> <rate>`
# (Nordic adaptivity 程序：nrf70 util tx_rate 0 6 → 固定 6 Mbps OFDM)
CONFIG_NRF70_UTIL=y

CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_WIFI=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_SHELL=y

# =============================================================================
# Networking（跟 applications/clip：IPv4 + UDP only）
# =============================================================================
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_LOG=n

CONFIG_MBEDTLS_HEAP_SIZE=1024

# =============================================================================
# Buffers & heaps（跟 applications/clip — 在本硬件上验证过的取值）
# =============================================================================
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_PKT_BUF_TX_DATA_POOL_SIZE=16384
CONFIG_NRF70_RX_NUM_BUFS=8
CONFIG_NRF70_MAX_TX_AGGREGATION=4
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=20000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=53000
# zperf UDP 上行需要比量产更宽裕的系统堆（量产无 zperf；送测版 80000）
CONFIG_HEAP_MEM_POOL_SIZE=80000

CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_MAX_CONN=6
CONFIG_NET_CONTEXT_SYNC_RECV=y
CONFIG_NET_SOCKETS_POLL_MAX=20
CONFIG_ZVFS_POLL_MAX=20
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16

# =============================================================================
# Threads / stacks（driver 栈跟 applications/clip，shell 栈跟样例）
# =============================================================================
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144
CONFIG_SHELL_STACK_SIZE=5200
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4600
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NRF70_IRQ_WQ_STACK_SIZE=2048
CONFIG_WIFI_NM_WPA_SUPPLICANT_THREAD_STACK_SIZE=10240
# 量产固件裁到 2048（AP-only 轻量路径够用）；STA + shell 的 supplicant
# iface workqueue 跑 2048 会栈溢出（hostap_iface_wq fatal）。NCS 默认 4400，
# 认证固件 RAM 富余，直接给足。
CONFIG_WIFI_NM_WPA_SUPPLICANT_WQ_STACK_SIZE=8192

# =============================================================================
# Shell & logging
# =============================================================================
CONFIG_SHELL=y
CONFIG_SHELL_GETOPT=y
CONFIG_SHELL_CMDS_RESIZE=n
CONFIG_SHELL_STACK_SIZE=5200
CONFIG_DEVICE_SHELL=y
CONFIG_DATE_SHELL=y
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_LOG_RATELIMIT=n
CONFIG_INIT_STACKS=y
CONFIG_STACK_SENTINEL=y

# =============================================================================
# Kernel & libc
# =============================================================================
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y
# wifi status 的 "Current PHY TX rate (Mbps) : %.1f" 走 Zephyr 自带 cbprintf
# （CBPRINTF_COMPLETE），newlib 的浮点开关不够，必须开 cbprintf 的 FP 支持。
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_REBOOT=y
# WPA supplicant requires POSIX timers (applications/clip 同款)。
# hostap 会 select POSIX_API（量产固件同样如此）——必须配 NEWLIB 而不是
# NCS 默认的 picolibc：picolibc + _POSIX_C_SOURCE 下 signal.h 的
# struct sigevent 与 Zephyr POSIX 实现冲突（timer.c 编译报错）。
CONFIG_POSIX_TIMERS=y

# =============================================================================
# Board: disable unused reSpeaker Clip module defaults
# (same set as samples/wifi_sta_iperf — the lab-proven STA build)
# =============================================================================
CONFIG_OLED_DISPLAY=n
CONFIG_DISPLAY=n
CONFIG_MFD_NPM13XX=n
CONFIG_GPIO_NPM13XX=n
CONFIG_REGULATOR_NPM13XX=n
CONFIG_HWINFO=y
CONFIG_HWINFO_SHELL=n

# The clip_usb_dfu module defaults on; its default-CDC references &usbd,
# which this build's overlay disables (USB off).
CONFIG_CLIP_USB_DFU=n
