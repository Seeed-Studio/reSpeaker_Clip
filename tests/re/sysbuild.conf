# RE firmware — MCUboot build (default).
#
# Inherits the board sysbuild defaults (boards/seeed/clip/Kconfig.sysbuild):
# MCUboot + signed dual-image OTA + NETCORE ipc_radio + secure netcore.
# Flash once via J-Link with the merged hex, then upgrade over USB serial
# DFU (MCUboot serial recovery) or BLE OTA like the application firmware.
#
# Direct-J-Link variant (links at 0x0, no bootloader — factory/test flash):
# uncomment the three lines below. With Partition Manager disabled the image
# links at 0x0; with it enabled the app lands in the mcuboot slot.
#
# SB_CONFIG_BOOTLOADER_NONE=y
# SB_CONFIG_SECURE_BOOT_NETCORE=n
# SB_CONFIG_PARTITION_MANAGER=n
