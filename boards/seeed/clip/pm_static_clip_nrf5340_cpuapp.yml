# Static Partition Manager configuration for Clip nRF5340
# 2-image MCUboot: App core + Network core
# WiFi firmware stored in internal flash (not ext flash)
#
# Internal flash layout (1MB = 1024KB total):
#   0x000000 - 0x015fff : mcuboot (88KB)
#   0x016000 - 0xfffff  : mcuboot_primary / app (936KB = 0xea000)
#   88 + 936 = 1024KB (full 1MB utilized)
#
# External flash layout:
#   0x000000 - 0x0effff : mcuboot_secondary (app OTA slot, 960KB=15x64KB, 64KB-aligned)
#   0x0f0000 - 0x12dfff : mcuboot_secondary_1 (netcore OTA slot, 248KB)
#   0x12e000 - 0x12efff : sn_a_partition (factory SN backup copy A, 4KB)
#   0x12f000 - 0x12ffff : sn_b_partition (factory SN backup copy B, 4KB)
#   0x130000 - end      : lfs-storage (LittleFS for config, ~6.8MB=109x64KB, 64KB-aligned)

# ============================================================
# Internal flash (flash_primary)
# ============================================================
mcuboot:
  address: 0x0
  size: 0x16000
  region: flash_primary

mcuboot_pad:
  address: 0x16000
  size: 0x200
  region: flash_primary

app:
  address: 0x16200
  size: 0xe9e00
  region: flash_primary

mcuboot_primary:
  orig_span: &id001
  - mcuboot_pad
  - app
  span: *id001
  address: 0x16000
  size: 0xea000
  region: flash_primary

mcuboot_primary_app:
  orig_span: &id002
  - app
  span: *id002
  address: 0x16200
  size: 0xe9e00
  region: flash_primary

# ============================================================
# RAM flash (for netcore primary slot)
# ============================================================
mcuboot_primary_1:
  address: 0x0
  size: 0x40000
  device: flash_ctrl
  region: ram_flash

# ============================================================
# External flash (PY25Q64H) -- DFU secondary slots only
# ============================================================

# DFU secondary slot for app (image 0) -- 960KB = 15x64KB, clip.signed.bin fits (892136B < 983040B)
# NOTE: 64KB-aligned (external flash page=64KB), rounded UP from mcuboot_primary (0xe8000).
mcuboot_secondary:
  address: 0x0
  size: 0xf0000
  device: DT_CHOSEN(nordic_pm_ext_flash)
  region: external_flash

# DFU secondary slot for netcore (image 1) -- 248KB (was 256KB; last 8KB
# carved out for the SN backup sectors below). ipc_radio.bin fits
# (173256B < 253952B). Netcore OTA writes from the slot head and never
# reached the tail.
mcuboot_secondary_1:
  address: 0xf0000
  size: 0x3e000
  device: DT_CHOSEN(nordic_pm_ext_flash)
  region: external_flash

# Factory SN dual backup -- two raw 4KB sectors outside LittleFS,
# immune to settings-file corruption, the settings-load watchdog wipe,
# AT+PAIR=reset's LittleFS rebuild and AT+FACTORY. See config.c sn_ab_*.
sn_a_partition:
  address: 0x12e000
  size: 0x1000
  device: DT_CHOSEN(nordic_pm_ext_flash)
  region: external_flash

sn_b_partition:
  address: 0x12f000
  size: 0x1000
  device: DT_CHOSEN(nordic_pm_ext_flash)
  region: external_flash

# LittleFS storage partition on external flash
lfs_storage:
  address: 0x130000
  size: 0x6d0000
  device: DT_CHOSEN(nordic_pm_ext_flash)
  region: external_flash
